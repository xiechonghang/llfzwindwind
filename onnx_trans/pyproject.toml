[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-trans"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.7", "safetensors>=0.5", "onnx>=1.17", "onnxscript>=0.3", "numpy>=1.26"]

[project.scripts]
onnx-trans = "onnx_trans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
